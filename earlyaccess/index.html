<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="SURGE caffeinated gum and mints. Join the early-access list."
    />
    <meta name="theme-color" content="#9ddcf0" />
    <title>SURGE Early Access — The freshest thing in your pocket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css?v=5" />
    <link rel="stylesheet" href="../shared.css?v=6" />
    <script src="../app.js?v=3" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <a class="wordmark" href="../homepage/index.html" aria-label="SURGE homepage" translate="no">
        SURGE<span aria-hidden="true">®</span>
      </a>
      <nav aria-label="Primary">
        <a href="../homepage/index.html">Home</a>
        <a aria-current="page" href="index.html">Early access</a>
      </nav>
    </header>

    <main id="main">
      <section class="dossier" aria-labelledby="hero-title">
        <div class="dossier-copy">
          <h1 id="hero-title">The freshest thing in your pocket.</h1>
          <p class="dossier-lede">
            <span>Fresh breath.</span>
            <span>Fresh energy.</span>
            <span class="dossier-lede-detail">In a case made to be seen.</span>
          </p>

          <div class="formula-toggle" role="group" aria-label="Choose a formula">
            <button
              class="formula-button is-active"
              type="button"
              data-formula="surge"
              aria-pressed="true"
            >
              <span translate="no">SURGE</span>
              <small>Caffeinated</small>
            </button>
            <button
              class="formula-button"
              type="button"
              data-formula="resurge"
              aria-pressed="false"
            >
              <span translate="no">RESURGE</span>
              <small>Caffeine-free</small>
            </button>
          </div>
        </div>

        <figure class="dossier-object" data-formula-stage="surge">
          <div class="measured-object">
            <div class="product-case product-case--dossier" data-tilt aria-hidden="true">
              <span class="case-mark" translate="no">SURGE</span>
              <span class="case-detail">POCKET GUM / S—01</span>
              <span class="case-notch"></span>
            </div>
          </div>
          <figcaption class="visually-hidden" data-product-caption>
            A brushed aluminum SURGE pocket case on a SURGE Blue product stage.
          </figcaption>
        </figure>

        <section class="signup-panel" id="early-access" aria-labelledby="early-access-title">
          <div class="signup-intro">
            <h2 class="signup-title" id="early-access-title">Get early access</h2>
          </div>

          <form class="signup" novalidate>
            <label for="email">
              Email address<span class="visually-hidden"> required</span>
            </label>
            <div class="input-row">
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                inputmode="email"
                placeholder="you@example.com…"
                aria-describedby="form-message"
                spellcheck="false"
                required
              />
              <button type="submit">Join</button>
            </div>
            <p class="form-message" id="form-message" aria-live="polite"></p>
          </form>
        </section>

        <dl class="dossier-specs" aria-label="Selected product details">
          <div>
            <dt>Formula</dt>
            <dd data-formula-detail>Caffeinated</dd>
          </div>
          <div>
            <dt>Taste</dt>
            <dd>Seriously minty</dd>
          </div>
          <div>
            <dt>Case</dt>
            <dd>Sculpted aluminum</dd>
          </div>
        </dl>
      </section>
    </main>

    <footer class="site-footer" id="contact">
      <p translate="no">SURGE® | © 2026</p>
    </footer>
  </body>
</html>
